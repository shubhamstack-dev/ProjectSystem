services:

  mysql:

    image: mysql:8.0

    container_name: projectsystem-mysql

    restart: unless-stopped

    environment:

      MYSQL_ROOT_PASSWORD: root@123

      MYSQL_DATABASE: projectsystem

    ports:

      - "3307:3307"

    volumes:

      - mysql_data:/var/lib/mysql

      - ./backend/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro

    healthcheck:

      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot@123"]

      interval: 5s

      timeout: 5s

      retries: 10

  backend:

    build:

      context: ./backend

    container_name: projectsystem-backend

    restart: unless-stopped

    depends_on:

      mysql:

        condition: service_healthy

    environment:

      DATABASE_URL: "mysql+pymysql://root:root%40123@mysql:3306/projectsystem"

      CORS_ORIGINS: "http://localhost:5173"

    ports:

      - "8000:8000"

  frontend:

    build:

      context: ./frontend

    container_name: projectsystem-frontend

    restart: unless-stopped

    depends_on:

      - backend

    ports:

      - "5173:5173"

volumes:

  mysql_data: